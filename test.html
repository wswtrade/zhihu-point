<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Test</title>
</head>
<body>
<h1>Loading Three.js...</h1>
<div id="result"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
document.getElementById('result').innerHTML += 'THREE loaded: ' + (typeof THREE !== 'undefined') + '<br>';
document.getElementById('result').innerHTML += 'OrbitControls loaded: ' + (typeof THREE.OrbitControls !== 'undefined') + '<br>';
try {
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
  var renderer = new THREE.WebGLRenderer();
  document.getElementById('result').innerHTML += 'Scene created OK<br>';
} catch(e) {
  document.getElementById('result').innerHTML += 'ERROR: ' + e.message + '<br>';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知点 ZhiPoint — 用知识图谱重新发现知乎</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:#FFF8F0;color:#3D3529;min-height:100vh;overflow:hidden}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px}
h1{font-size:52px;font-weight:700;margin-bottom:8px}
h1 small{font-size:20px;font-weight:400;color:#9CA3AF;margin-left:8px}
.sub{color:#6B6356;font-size:15px;margin-bottom:40px;line-height:1.6}
.enter-btn{padding:14px 48px;font-size:16px;font-weight:600;border:none;border-radius:12px;background:linear-gradient(135deg,#D97706,#EA580C);color:#fff;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(217,119,6,.35);transition:all .2s}
.enter-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(217,119,6,.45)}
.feats{display:flex;gap:14px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.feat{display:flex;align-items:center;gap:6px;font-size:13px;color:#6B6356;background:rgba(255,255,255,.8);padding:6px 14px;border-radius:20px;backdrop-filter:blur(4px);border:1px solid rgba(232,224,212,.6)}
.feat i{color:#D97706;font-size:12px}
</style>
</head>
<body>
<canvas id="lc"></canvas>
<div class="content">
  <h1>知点<small>ZhiPoint</small></h1>
  <p class="sub">用知识图谱重新发现知乎 · Agent 社交宇宙</p>
  <a href="app.html" class="enter-btn">进入知点</a>
  <div class="feats">
    <div class="feat"><i class="fas fa-globe"></i> 3D 星图</div>
    <div class="feat"><i class="fas fa-fire"></i> 热点雷达</div>
    <div class="feat"><i class="fas fa-project-diagram"></i> 知识脉络</div>
    <div class="feat"><i class="fas fa-robot"></i> AI 解读</div>
    <div class="feat"><i class="fas fa-users"></i> 圈子社交</div>
  </div>
</div>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script>
var lCanvas=document.getElementById('lc'),lCtx=lCanvas.getContext('2d');
lCanvas.width=window.innerWidth;lCanvas.height=window.innerHeight;
var lPs=[];
for(var i=0;i<200;i++)lPs.push({x:Math.random()*lCanvas.width,y:Math.random()*lCanvas.height,r:Math.random()*1.5+0.3,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,a:Math.random()*0.6+0.2});
function animL(){
  lCtx.fillStyle='rgba(255,248,240,0.15)';lCtx.fillRect(0,0,lCanvas.width,lCanvas.height);
  lPs.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=lCanvas.width;if(p.x>lCanvas.width)p.x=0;if(p.y<0)p.y=lCanvas.height;if(p.y>lCanvas.height)p.y=0;lCtx.beginPath();lCtx.arc(p.x,p.y,p.r,0,Math.PI*2);lCtx.fillStyle='rgba(180,100,10,'+p.a+')';lCtx.fill()});
  for(var i=0;i<lPs.length;i++)for(var j=i+1;j<lPs.length;j++){var dx=lPs[i].x-lPs[j].x,dy=lPs[i].y-lPs[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<100){lCtx.beginPath();lCtx.moveTo(lPs[i].x,lPs[i].y);lCtx.lineTo(lPs[j].x,lPs[j].y);lCtx.strokeStyle='rgba(180,100,10,'+(0.12*(1-d/100))+')';lCtx.stroke()}}
  requestAnimationFrame(animL);
}
animL();
window.addEventListener('resize',function(){lCanvas.width=window.innerWidth;lCanvas.height=window.innerHeight});
</script>
</body>
</html>

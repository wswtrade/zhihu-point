<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知点 ZhiPoint — 用知识图谱重新发现知乎</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:#FAF7F2;color:#3D3529;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{text-align:center;max-width:500px;padding:40px}
h1{font-size:48px;font-weight:700;margin-bottom:8px}
h1 small{font-size:20px;font-weight:400;color:#9CA3AF;margin-left:8px}
.sub{color:#6B6356;font-size:15px;margin-bottom:36px;line-height:1.6}
.btn{display:inline-block;padding:12px 36px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .2s;margin:6px}
.btn-p{background:#D97706;color:#fff;box-shadow:0 4px 14px rgba(217,119,6,.3)}
.btn-p:hover{background:#B45309;transform:translateY(-1px)}
.btn-s{background:#fff;color:#3D3529;border:1px solid #E8E0D4}
.btn-s:hover{border-color:#D97706}
.feats{display:flex;gap:16px;justify-content:center;margin:30px 0;flex-wrap:wrap}
.feat{display:flex;align-items:center;gap:6px;font-size:13px;color:#6B6356;background:#fff;padding:6px 14px;border-radius:20px;border:1px solid #E8E0D4}
.feat i{color:#D97706}
</style>
</head>
<body>
<div class="wrap">
  <h1>知点<small>ZhiPoint</small></h1>
  <p class="sub">用知识图谱重新发现知乎 · Agent 社交宇宙</p>
  <div class="feats">
    <div class="feat"><i class="fas fa-globe"></i> 3D 星图</div>
    <div class="feat"><i class="fas fa-fire"></i> 热点雷达</div>
    <div class="feat"><i class="fas fa-project-diagram"></i> 知识脉络</div>
    <div class="feat"><i class="fas fa-robot"></i> AI 解读</div>
    <div class="feat"><i class="fas fa-users"></i> 圈子社交</div>
  </div>
  <a class="btn btn-p" href="app.html">进入知点</a>
  <button class="btn btn-s" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> 登录知乎</button>
</div>
<script>
var APP_ID='296',APP_KEY='4a1933db473d4829a256cf772aa62202';
function doLogin(){
  var url='https://openapi.zhihu.com/authorize?app_id='+encodeURIComponent(APP_ID)+'&response_type=code&redirect_uri='+encodeURIComponent(window.location.origin+window.location.pathname.replace('index.html','app.html'));
  window.open(url,'zhihu_login','width=600,height=650,left='+(screen.width/2-300)+',top='+(screen.height/2-325)+',scrollbars=yes');
}
</script>
</body>
</html>
